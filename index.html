<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:20px;
font-family:Arial,Helvetica,sans-serif;color:#fff;
background:
radial-gradient(ellipse at 15% 15%,#142a52 0%,transparent 42%),
radial-gradient(ellipse at 85% 85%,#291744 0%,transparent 40%),
#080b12;
}
.card{
position:relative;width:100%;max-width:380px;
padding:34px 24px 25px;text-align:center;
border-radius:25px;
border:1px solid rgba(255,255,255,.2);
background:linear-gradient(145deg,
rgba(255,255,255,.11),rgba(255,255,255,.035));
box-shadow:0 15px 55px rgba(0,0,0,.45),
0 0 30px rgba(90,160,255,.08);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
overflow:hidden;
}
.card:before{
content:"";position:absolute;inset:0;
border-radius:25px;padding:1px;
background:linear-gradient(135deg,#6ee7ff,transparent 38%,
#9b8cff 75%,transparent);
-webkit-mask:linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;pointer-events:none;
}
.logo{
height:68px;width:68px;margin:0 auto 18px;
display:flex;align-items:center;justify-content:center;
border-radius:20px;font-size:28px;font-weight:900;
letter-spacing:-2px;color:#08111a;
background:linear-gradient(135deg,#7cecff,#b4a1ff);
box-shadow:0 0 28px rgba(110,231,255,.23);
}
.eyebrow{
font-size:11px;letter-spacing:3px;
text-transform:uppercase;color:#aebbd3;
margin-bottom:9px;
}
h1{
font-size:clamp(28px,8vw,35px);
letter-spacing:-1px;line-height:1.15;
background:linear-gradient(90deg,#fff,#83eaff,#b8a6ff);
-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent;
}
.desc{
color:#b7c0d2;font-size:14px;
line-height:1.7;margin:13px auto 24px;
max-width:280px;
}
.join{
display:flex;align-items:center;justify-content:center;
gap:10px;width:100%;min-height:54px;
padding:15px;border-radius:14px;
text-decoration:none;font-weight:800;font-size:15px;
color:#07111a;
background:linear-gradient(100deg,#8cecff,#b7a8ff);
box-shadow:0 7px 25px rgba(93,190,255,.23);
transition:transform .2s,box-shadow .2s;
}
.join:hover{
transform:translateY(-2px);
box-shadow:0 10px 32px rgba(93,190,255,.38);
}
.join:focus-visible{outline:2px solid white;outline-offset:4px}
.telegram{width:21px;height:21px}
.note{font-size:11px;color:#8f9ab1;margin-top:17px;line-height:1.6}
.footer{
font-size:10px;letter-spacing:2px;
color:#69758e;margin-top:20px;
}
</style>

<body>
<main class="card">
  <div class="logo">M<span style="color:#fff">T</span></div>

    Join our Telegram channel for cricket updates
    and match-related content.
  </p>

  <a class="join" id="joinButton"

    </svg>
    Join Channel Now
  </a>
 <p class="note">Tap above to open Marvel Tips on Telegram.</p>
  <p class="footer">MARVEL TIPS · OFFICIAL CHANNEL</p>
</main>

document.getElementById('joinButton').addEventListener('click',function(){
